version: '3.3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:15
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: gramulechka/foodgram_backend:latest
    env_file: .env
    volumes:
      - static:/app/static/
      - media:/app/media/
    depends_on:
      - db

  frontend:
    image: gramulechka/foodgram_frontend:latest
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static

  gateway:
    image: gramulechka/foodgram_gateway:latest
    volumes:
      - static:/usr/share/nginx/html/
      - media:/media/
    ports:
      - "80:80"
    depends_on:
      - backend
